<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Código e dados têm integrações diferentes</title><desc id="desc">Merge Git não funde registros de branches Neon.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#64748b"/></marker></defs><rect width="1600" height="900" fill="#f8fafc"/>
<text x="60" y="85" font-family="Arial, sans-serif" font-size="42" font-weight="500" fill="#0f172a" text-anchor="start">Código e dados têm integrações diferentes</text>
<text x="60" y="135" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#475569" text-anchor="start">Merge Git não funde registros de branches Neon.</text>
<rect x="70" y="210" width="420" height="150" rx="12" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="94" y="253" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#0f172a" text-anchor="start">Branch Git A</text>
<text x="94" y="292" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#334155" text-anchor="start">Código + arquivo de migration</text>
<rect x="70" y="400" width="420" height="150" rx="12" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="94" y="443" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#0f172a" text-anchor="start">Branch Git B</text>
<text x="94" y="482" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#334155" text-anchor="start">Outro código revisado</text>
<rect x="660" y="290" width="405" height="150" rx="12" fill="#e2e8f0" stroke="#cbd5e1"/>
<text x="684" y="333" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#0f172a" text-anchor="start">Integração de código</text>
<text x="684" y="372" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#334155" text-anchor="start">Review + merge Git</text>
<path d="M490,285 L660,345" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M490,475 L660,385" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="1190" y="290" width="340" height="150" rx="12" fill="#dcfce7" stroke="#cbd5e1"/>
<text x="1214" y="333" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#0f172a" text-anchor="start">Código alvo</text>
<text x="1214" y="372" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#334155" text-anchor="start">Mudanças integradas</text>
<path d="M1065,365 L1190,365" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="70" y="635" width="420" height="110" rx="12" fill="#fef3c7" stroke="#cbd5e1"/>
<text x="94" y="678" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#0f172a" text-anchor="start">Branch Neon A</text>
<text x="94" y="717" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#334155" text-anchor="start">Registros do experimento</text>
<rect x="660" y="635" width="405" height="110" rx="12" fill="#dcfce7" stroke="#cbd5e1"/>
<text x="684" y="678" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#0f172a" text-anchor="start">Branch Neon alvo</text>
<text x="684" y="717" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#334155" text-anchor="start">Aplicar migration revisada</text>
<text x="1230" y="680" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#0f172a" text-anchor="start">Dados experimentais</text>
<text x="1230" y="718" font-family="Arial, sans-serif" font-size="25" font-weight="500" fill="#0f172a" text-anchor="start">não vão no merge</text>
<text x="60" y="840" font-family="Arial, sans-serif" font-size="26" font-weight="500" fill="#0f172a" text-anchor="start">Migration define mudança de schema; transportar registros exige uma decisão separada.</text>
</svg>