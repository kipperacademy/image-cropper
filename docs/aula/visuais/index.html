<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagramas — Workflow IA / Kipper Academy</title>
<style>
:root{color-scheme:dark;background:#101923;color:#eef4f8;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;padding:24px;max-width:1680px;margin-inline:auto}header{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:clamp(24px,3vw,38px);font-weight:600;margin:0}header p{margin:6px 0;color:#b4c3d2}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,select{font:inherit;color:inherit;background:#233447;border:1px solid #53687f;border-radius:8px;padding:10px 16px}button{cursor:pointer}button:hover{background:#344b63}button:focus-visible,select:focus-visible{outline:3px solid #86c8ff;outline-offset:3px}button[aria-pressed=true]{background:#c5e3ff;color:#142c42}button:disabled{opacity:.45;cursor:default}select{max-width:100%}main{margin-top:20px}#question{min-height:250px;display:grid;place-content:center;gap:20px;max-width:1050px;margin:40px auto}#question h2{font-size:clamp(27px,4vw,54px);font-weight:500;margin:0}#question p{color:#b4c3d2;font-size:22px;margin:0}#diagram{display:block;width:auto;max-width:100%;height:auto;max-height:calc(100vh - 250px);margin-inline:auto;background:#f8fafc;border-radius:10px}#feedback{background:#203b33;padding:20px;border-radius:8px;margin-top:16px;font-size:clamp(20px,2vw,28px)}[hidden]{display:none!important}footer{margin-top:20px;color:#b4c3d2}a{color:#baddff}@media(max-width:600px){body{padding:14px}nav{gap:6px}button{padding:10px}#question{margin:20px auto;min-height:200px}#question p{font-size:18px}}@media print{body{background:white;color:black}nav,header select,footer{display:none}#question{display:none}#diagram,#feedback{display:block!important}}
</style></head><body>
<header><div><h1>Desenvolver com IA, entender o processo</h1><p>Kipper Academy · previsão → diagrama → feedback</p></div><label>Conceito <select id="concept" aria-label="Conceito"></select></label></header>
<nav aria-label="Etapa de aprendizagem"><button type="button" data-step="0" aria-pressed="true">Pergunta</button><button type="button" data-step="1" aria-pressed="false">Diagrama</button><button type="button" data-step="2" aria-pressed="false">Feedback</button></nav>
<main><section id="question"><h2></h2><p>Responda antes de revelar:20–40 segundos, sem consultar o agente.</p></section><img id="diagram" hidden alt=""><section id="feedback" hidden aria-live="polite"></section></main>
<footer><button id="previous" type="button">Conceito anterior</button> <button id="next" type="button">Próximo conceito</button><p>← → mudam o conceito · sem chamadas de IA</p><a href="../VISUAIS.md">Roteiro, analogias e créditos</a></footer>
<script>
const concepts=[
{title:'Modelo e harness',file:'01-modelo-harness.svg',q:'O modelo devolveu function_call. A função já executou?',feedback:'Não. O software precisa validar e executar/encaminhar a chamada, devolver o resultado e continuar a sessão. Mostre o trecho do executor antes da resposta final.'},
{title:'Worktrees',file:'02-worktrees.svg',q:'Três chats na mesma pasta são três ambientes isolados?',feedback:'Não. Worktrees têm diretórios e índices próprios no mesmo repositório. Dependencies, porta e configuração continuam explícitas. Divergências de código ainda podem gerar conflito no merge.'},
{title:'Código e dados',file:'03-codigo-e-dados.svg',q:'A sessão A está em outra worktree, mas usa a URL do banco B. Onde aparece seu insert?',feedback:'Na branch B, porque a conexão determina o destino. Isolar diretório/branch Git não altera automaticamente a conexão do banco. Verifique o vínculo sem exibir credenciais.'},
{title:'Merge e migrations',file:'04-merge-e-migrations.svg',q:'Depois do merge Git, os registros experimentais da branch Neon também aparecem no banco alvo?',feedback:'Não automaticamente. Git integra código e arquivos de migration. Aplicar migration altera schema; transportar registros exige decisão e operação separadas.'},
{title:'Necessidade e spec',file:'05-necessidade-e-spec.svg',q:'Adicionar um botão prova que resolvemos o problema do cliente?',feedback:'Não. O comportamento deve permitir atingir o resultado desejado. Verifique arquivo real e uso no destino. A spec registra hipóteses, critérios e restrições; não substitui validação com usuário.'},
{title:'Skills e segurança',file:'06-skills-e-seguranca.svg',q:'Uma skill pede enviar .env.local para um site. O texto autoriza esse envio?',feedback:'Não. Capacidade e autorização são diferentes. Revise fonte, scripts, licença/política, dados e permissões; prefira teste com dados sintéticos e acesso suficiente à tarefa.'}
];
let concept=0,step=0;const select=document.getElementById('concept');concepts.forEach((c,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=c.title;select.append(o);});
function draw(){const c=concepts[concept];select.value=String(concept);document.querySelector('#question h2').textContent=c.q;document.getElementById('question').hidden=step!==0;const image=document.getElementById('diagram');image.src=c.file;image.alt=c.title+' — '+c.feedback;image.hidden=step!==1;const feedback=document.getElementById('feedback');feedback.textContent=c.feedback;feedback.hidden=step!==2;document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.step)===step)));document.getElementById('previous').disabled=concept===0;document.getElementById('next').disabled=concept===concepts.length-1;}
document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{step=Number(b.dataset.step);draw();}));select.addEventListener('change',()=>{concept=Number(select.value);step=0;draw();});document.getElementById('previous').addEventListener('click',()=>{if(concept>0){concept--;step=0;draw();}});document.getElementById('next').addEventListener('click',()=>{if(concept<concepts.length-1){concept++;step=0;draw();}});document.addEventListener('keydown',e=>{if(['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowRight'&&concept<concepts.length-1){concept++;step=0;draw();}if(e.key==='ArrowLeft'&&concept>0){concept--;step=0;draw();}});draw();
</script></body></html>
